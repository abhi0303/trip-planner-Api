# Render blueprint — https://render.com/docs/blueprint-spec
#
# Render runs the web service only. Postgres and file storage are both Neon, so
# there is no `databases:` block here and nothing stateful on Render.
#
# Deploy:
#   1. Create the Neon project, then a bucket:
#        neon buckets create tripsphere-media --access-level public_read
#        neon credentials create --scope storage:read --scope storage:write
#   2. Push this repo, then New > Blueprint in the Render dashboard.
#   3. Fill in the envVars marked `sync: false` (Render prompts for them).
services:
  - type: web
    name: tripsphere-api
    runtime: node
    plan: free
    # Match the Neon project region to keep the database round trip short.
    region: singapore
    branch: main
    # preflight-db refuses to migrate through Neon's pooled endpoint. Prisma
    # migrations are not transactional, so DDL through PgBouncer can half-apply
    # and wedge the database — see the recovery runbook in README.md.
    # --include=dev is required: NODE_ENV=production below makes npm omit
    # devDependencies, and the build tooling (@nestjs/cli, typescript) lives
    # there. Without it the build dies on "sh: 1: nest: not found".
    buildCommand: npm ci --include=dev && node scripts/preflight-db.mjs && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1

      # --- Neon Postgres -------------------------------------------------
      # Pooled connection (host contains "-pooler") for the app.
      - key: DATABASE_URL
        sync: false
      # Direct connection for `prisma migrate deploy` during the build.
      # MUST NOT contain '-pooler' — in the Neon console that is
      # Connect > "Connection pooling" toggle OFF. The build refuses to
      # migrate otherwise.
      - key: DIRECT_URL
        sync: false

      # Prisma Migrate serialises itself with a session-scoped advisory lock.
      # A migration killed mid-run can leave that lock held on a Neon compute,
      # and every later deploy then fails with P1002 until the compute is
      # restarted. One instance runs migrations here, so the lock protects
      # nothing worth that failure mode. Remove this if migrations ever run
      # from more than one place at once.
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: 'true'

      # --- Auth ----------------------------------------------------------
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Neon Object Storage -------------------------------------------
      - key: MEDIA_DRIVER
        value: neon
      - key: NEON_STORAGE_ENDPOINT
        sync: false
      - key: NEON_STORAGE_REGION
        value: us-east-2
      - key: NEON_STORAGE_BUCKET
        value: tripsphere-media
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: NEON_STORAGE_ACCESS_LEVEL
        value: public_read
      - key: MEDIA_MAX_FILE_SIZE_MB
        value: '10'

      # --- App -----------------------------------------------------------
      - key: CORS_ORIGINS
        sync: false
      - key: SWAGGER_ENABLED
        value: 'true'
      - key: SWAGGER_PATH
        value: docs
      - key: MIN_SAMPLE_SIZE
        value: '3'
      - key: THROTTLE_TTL
        value: '60'
      - key: THROTTLE_LIMIT
        value: '120'
