services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripsphere
      POSTGRES_PASSWORD: tripsphere
      POSTGRES_DB: tripsphere
    ports:
      - '5434:5432'
    volumes:
      - tripsphere-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripsphere -d tripsphere']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tripsphere-pgdata:
